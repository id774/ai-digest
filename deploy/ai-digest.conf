# Example nginx server block. Replace the host and certificate paths.
# The viewer serves stored files only, so nothing here needs a long
# timeout: the batch that calls the API runs from cron, not from a
# request.

server {
    listen 443 ssl;
    server_name digest.example.net;

    ssl_certificate     /etc/ssl/certs/digest.example.net.crt;
    ssl_certificate_key /etc/ssl/private/digest.example.net.key;

    # The composite image of one day is a few hundred kilobytes.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Restrict the readers. Pick one of these, or use a VPN instead.
    # location / {
    #     auth_basic "ai-digest";
    #     auth_basic_user_file /etc/nginx/ai-digest.htpasswd;
    #     proxy_pass http://127.0.0.1:3000;
    # }
    # location / {
    #     allow 192.0.2.0/24;
    #     deny all;
    #     proxy_pass http://127.0.0.1:3000;
    # }

    access_log /var/log/nginx/ai-digest_access.log;
    error_log  /var/log/nginx/ai-digest_error.log;
}

server {
    listen 80;
    server_name digest.example.net;
    return 301 https://$host$request_uri;
}
